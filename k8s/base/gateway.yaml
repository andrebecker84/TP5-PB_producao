# =========================================================================
# api-gateway — ponto único de entrada, BFF do login.
#
# Duas portas, dois Services, como no Compose:
#   gateway            21443  rede interna: sondas e Prometheus
#   gateway-navegador  21080  o navegador; a única exposta fora do cluster,
#                             e que responde 404 às rotas de operação
#
# A sessão do login fica no Redis (redis.yaml), compartilhada pelas réplicas:
# qualquer uma atende qualquer navegador, e uma réplica que reinicia não leva
# as sessões junto. O Service ainda prende cada navegador a uma réplica pelo IP
# de origem (sessionAffinity), agora só por economia: a conexão ao vivo das
# notificações e as chamadas seguintes reaproveitam a mesma réplica.
# =========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/component: borda }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: gateway }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: borda
        infnethub.io/job: api-gateway
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 0
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: gateway }
      containers:
        - name: gateway
          image: infnethub/gateway
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 21443 }
            - { name: navegador, containerPort: 21080 }
          envFrom:
            - configMapRef: { name: infnethub-ambiente }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: k8s }
            - { name: SERVER_PORT, value: "21443" }
            - { name: PORTA_DO_NAVEGADOR, value: "21080" }
            - name: KEYCLOAK_BFF_SECRET
              valueFrom: { secretKeyRef: { name: infnethub-segredos, key: KEYCLOAK_BFF_SECRET } }
            - name: REDIS_PASS
              valueFrom: { secretKeyRef: { name: infnethub-segredos, key: REDIS_PASS } }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: 1500m, memory: 576Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: { app.kubernetes.io/name: gateway }
spec:
  selector: { app.kubernetes.io/name: gateway }
  ports:
    - { name: http, port: 21443, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-navegador
  labels: { app.kubernetes.io/name: gateway }
spec:
  selector: { app.kubernetes.io/name: gateway }
  sessionAffinity: ClientIP
  ports:
    - { name: navegador, port: 21080, targetPort: navegador }
