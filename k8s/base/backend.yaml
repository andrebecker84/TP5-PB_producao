# =========================================================================
# infnethub-core — identidade, feed e vagas; produtor dos eventos.
#
# O nome "backend" é o mesmo do Compose, de propósito: o gateway, o Prometheus
# e os roteiros de demonstração o chamam pelo mesmo nome nos dois ambientes.
#
# Uma réplica de partida, e o autoescalonamento (autoescala.yaml) acrescenta
# outras sob carga. Mais de uma instância é seguro: a caixa de saída trava o
# lote com FOR UPDATE SKIP LOCKED, e duas instâncias não publicam o mesmo
# evento. A partida com uma só evita duas cargas de demonstração concorrentes
# num banco vazio.
#
# O prazo da saga de expurgo é encurtado para caber numa demonstração, como no
# Compose; o padrão da aplicação é um dia.
# =========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend, app.kubernetes.io/component: servico }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # Atualização gradual sem perder capacidade: um pod novo sobe e fica pronto
  # antes de um antigo sair (maxUnavailable 0).
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: servico
        # Lido pelo Prometheus (observabilidade/config/prometheus.yml): o nome do
        # job é o mesmo do Compose, e o mesmo painel e as mesmas regras de
        # alerta valem nos dois ambientes.
        infnethub.io/job: infnethub-core
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 0
        seccompProfile: { type: RuntimeDefault }
      # Réplicas espalhadas pelos nós: um nó que cai não leva todas.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: backend }
      # Espera o próprio banco aceitar conexões. Sem isto a aplicação sobe,
      # falha no Flyway e é reiniciada até o banco ficar pronto: funciona, mas
      # enche o histórico de reinícios e confunde quem olha o cluster. O -U é
      # obrigatório: sem ele o pg_isready infere o usuário do sistema, e o UID
      # sem nome deste contêiner o faz desistir sem tentar ("no attempt").
      initContainers:
        - name: aguardar-banco
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -q -h postgres -U sonda -t 2; do echo aguardando postgres; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: backend
          image: infnethub/backend
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 21081 }
          envFrom:
            - configMapRef: { name: infnethub-ambiente }
          env:
            - { name: SERVER_PORT, value: "21081" }
            - { name: DB_URL, value: "jdbc:postgresql://postgres:5432/infnethub" }
            - { name: DB_USER, value: infnethub }
            - name: DB_PASS
              valueFrom: { secretKeyRef: { name: infnethub-segredos, key: DB_PASS_CORE } }
            - name: RABBIT_PASS
              valueFrom: { secretKeyRef: { name: infnethub-segredos, key: RABBIT_PASS } }
            - { name: APP_EXPURGO_PRAZO, value: "PT2M" }
            - { name: APP_EXPURGO_VERIFICACAO_MS, value: "5000" }
          # startup: até 3 min para a primeira subida (Flyway, carga de
          # demonstração) sem a liveness matar o pod no meio do caminho.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          # Prazo de resposta das sondas: o padrão do Kubernetes é 1 segundo.
          # Sob carga, com a CPU no limite e o coletor de lixo trabalhando, a
          # resposta passava disso; a liveness reiniciava um pod que estava
          # só ocupado, e a carga dele caía sobre os outros.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Na saída, alguns segundos antes do SIGTERM: o tempo de o Service
          # tirar o pod da lista de destinos, para nenhuma requisição nova
          # chegar a um processo que já está encerrando.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 200m, memory: 448Mi }
            limits: { cpu: 1500m, memory: 640Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        # Sistema de arquivos só de leitura; o Tomcat e a JVM escrevem aqui.
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend }
spec:
  selector: { app.kubernetes.io/name: backend }
  ports:
    - { name: http, port: 21081, targetPort: http }
