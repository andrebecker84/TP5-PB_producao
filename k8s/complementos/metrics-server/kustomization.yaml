# =========================================================================
# metrics-server — de onde o HorizontalPodAutoscaler lê a CPU de cada pod.
#
# Um cluster gerenciado (EKS, GKE, AKS) já o traz; o kind, não. A versão é a
# publicada pelo próprio projeto (kubernetes-sigs), com um ajuste: no kind, o
# certificado do kubelet é autoassinado, e sem --kubelet-insecure-tls o
# metrics-server recusa a conexão e o autoescalonamento fica sem dado nenhum.
# Num cluster de verdade, esse ajuste não se aplica.
# =========================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml

patches:
  - target: { kind: Deployment, name: metrics-server, namespace: kube-system }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
