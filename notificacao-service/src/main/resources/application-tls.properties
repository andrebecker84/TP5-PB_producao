# =========================================================================
# Perfil tls — o serviço dentro do docker-compose.yml, com tráfego cifrado.
#
# Separado do perfil dev de propósito: rodando pela IDE, o serviço não tem os
# certificados, e continua subindo em HTTP simples na máquina de quem
# desenvolve. No Compose, ativo junto com o dev.
#
# Os certificados vêm do volume gerado por infra/certificados/gerar.sh. A
# confiança na autoridade de desenvolvimento é da JVM inteira (JAVA_TOOL_OPTIONS
# no Compose): todo cliente — Eureka, RabbitMQ, JWKS do Keycloak — a usa sem
# configuração própria.
# =========================================================================

# HTTPS na porta do serviço. Não há porta HTTP: quem chega aqui é o gateway,
# o Prometheus e o healthcheck, todos por TLS.
spring.ssl.bundle.pem.servidor.keystore.certificate=${TLS_CERTIFICADO:/certs/servidor.crt}
spring.ssl.bundle.pem.servidor.keystore.private-key=${TLS_CHAVE:/certs/servidor.key}
server.ssl.bundle=servidor

# Registro no Eureka pelo IP, com a porta segura. O IP é o de cada instância:
# com três do serviço de notificação no ar, o gateway enxerga três, reparte
# entre elas e deixa de mandar para a que sair. O certificado não tem os IPs do
# Docker, e por isso o gateway confere a cadeia, e não o nome, só neste trecho —
# ver ConexaoComOsServicos, no gateway.
eureka.instance.prefer-ip-address=true
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=${server.port}

# AMQP sobre TLS (5671), com verificação do nome do nó. Os três endereços do
# cluster vêm de SPRING_RABBITMQ_ADDRESSES: se um nó cair, a conexão é refeita
# com o seguinte.
spring.rabbitmq.ssl.enabled=true
spring.rabbitmq.ssl.verify-hostname=true
# TLS 1.3 — o padrão do Spring ainda é o 1.2.
spring.rabbitmq.ssl.algorithm=TLSv1.3
# A lista de nós embaralhada a cada conexão: sem isso, todas as instâncias de
# todos os serviços se ligariam ao primeiro nó da lista, e os outros dois só
# veriam clientes quando ele caísse.
spring.rabbitmq.address-shuffle-mode=random
