# ── Perfil dev — PostgreSQL PRÓPRIO das notificações ───────────────────────
# Porta 21434: terceira instância de PostgreSQL do sistema, ao lado da do core
# (21432) e da do boletim (21433). Database per Service, como nos outros.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:21434}/notificacao}
spring.datasource.username=${DB_USER:notificacao}
spring.datasource.password=${DB_PASS:notificacao}
spring.datasource.driver-class-name=org.postgresql.Driver

# O schema é responsabilidade do Flyway. O Hibernate apenas confere se o
# mapeamento das entidades bate com as tabelas existentes e falha no start caso
# tenham divergido.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
