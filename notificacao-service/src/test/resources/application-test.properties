# ── Perfil test — H2 em memória ────────────────────────────────────────────
# Banco descartável por execução: cada classe parte de um schema limpo, sem
# depender de Docker nem de estado deixado por testes anteriores.
spring.datasource.url=jdbc:h2:mem:notificacaodb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# O Hibernate gera o schema a partir das entidades. As migrations do PostgreSQL
# — com as CHECK constraints que o H2 não reproduz igual — têm cobertura própria
# quando o serviço sobe em dev e o ddl-auto=validate confere o mapeamento.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Infraestrutura distribuída desligada ───────────────────────────────────
# Sem isto, cada contexto de teste tenta se registrar num Eureka que não existe:
# o start fica mais lento pelas tentativas e o log enche de erros que nada têm a
# ver com o que está sendo testado.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

# O consumidor não sobe nos testes de serviço: não há broker, e o ouvinte
# tentaria conectar a cada poucos segundos. Os testes de mensageria sobem um
# RabbitMQ real em contêiner e religam o consumidor.
spring.rabbitmq.listener.simple.auto-startup=false

logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.test=WARN

# ── Nenhum broker ao alcance ───────────────────────────────────────────────
# Porta sem serviço, de propósito. Se o ambiente de desenvolvimento estiver no
# ar nesta máquina, a porta padrão (21672) apontaria para um RabbitMQ de
# verdade, e um teste de serviço publicaria nele sem ninguém perceber. Os
# testes de mensageria sobem o próprio broker em contêiner, que substitui esta
# configuração.
spring.rabbitmq.port=1
