<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Infnet Hub — TP5: Implantação e Operação em Produção">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1c3c"/>
      <stop offset="60%" stop-color="#050f22"/>
      <stop offset="100%" stop-color="#030a16"/>
    </linearGradient>
    <radialGradient id="lua" cx="0.5" cy="0" r="0.75">
      <stop offset="0%" stop-color="#3b8ef5" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#3b8ef5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b8ef5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pontos" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.1" fill="#5aa8ff" opacity="0.35"/>
    </pattern>
    <radialGradient id="luzMovel" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="revela">
      <rect width="1200" height="300" fill="#ffffff" opacity="0.25"/>
      <circle class="farol" cx="0" cy="150" r="220" fill="url(#luzMovel)"/>
    </mask>
    <linearGradient id="con" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#5aa8ff"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="no" cx="0.4" cy="0.35" r="0.75"><stop offset="0%" stop-color="#eaf6ff"/><stop offset="55%" stop-color="#5ab4f5"/><stop offset="100%" stop-color="#2a7fd8"/></radialGradient>
    <radialGradient id="nucleo" cx="0.36" cy="0.26" r="0.9"><stop offset="0%" stop-color="#ffffff"/><stop offset="42%" stop-color="#b9f2ff"/><stop offset="100%" stop-color="#2fc6ef"/></radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#6fe4ff" stop-opacity="0.75"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="cometa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="80%" stop-color="#a5f3fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <style>
      .farol { animation: varre 9s ease-in-out infinite alternate; }
      @keyframes varre { from { transform: translateX(80px); } to { transform: translateX(1120px); } }
      .marca { animation: pulsa 4s ease-in-out infinite; transform-origin: 600px 92px; }
      @keyframes pulsa { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      .titulo, .sub, .stack { opacity: 0; animation: surge 1.2s ease-out forwards; }
      .sub { animation-delay: .4s; }
      .stack { animation-delay: .8s; }
      @keyframes surge { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .rastro { animation: corre 5s cubic-bezier(.45,0,.2,1) infinite; }
      @keyframes corre { 0% { transform: translateX(-260px); opacity: 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(1200px); opacity: 0; } }
      text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#fundo)"/>
  <rect width="1200" height="300" fill="url(#lua)"/>
  <rect width="1200" height="300" fill="url(#pontos)" mask="url(#revela)"/>

  <!-- o cometa que atravessa, como na abertura do login -->
  <g class="rastro">
    <rect x="0" y="272" width="220" height="2" rx="1" fill="url(#cometa)"/>
    <circle cx="220" cy="273" r="3" fill="#ffffff"/>
    <circle cx="220" cy="273" r="9" fill="#a5f3fc" opacity="0.35"/>
  </g>

  <!-- a marca -->
  <g class="marca">
    <svg x="560" y="52" width="80" height="80" viewBox="0 0 64 64">
      <path d="M32 11 L50.19 21.5 L50.19 42.5 L32 53 L13.81 42.5 L13.81 21.5 Z" stroke="url(#con)" stroke-width="1.5" stroke-linejoin="round" opacity="0.55" fill="none"/>
      <g stroke="url(#con)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"><line x1="32" y1="32" x2="32" y2="11"/><line x1="32" y1="32" x2="50.19" y2="21.5"/><line x1="32" y1="32" x2="50.19" y2="42.5"/><line x1="32" y1="32" x2="32" y2="53"/><line x1="32" y1="32" x2="13.81" y2="42.5"/><line x1="32" y1="32" x2="13.81" y2="21.5"/></g>
      <g fill="url(#no)"><circle cx="32" cy="11" r="3"/><circle cx="50.19" cy="21.5" r="3"/><circle cx="50.19" cy="42.5" r="3"/><circle cx="32" cy="53" r="3"/><circle cx="13.81" cy="42.5" r="3"/><circle cx="13.81" cy="21.5" r="3"/></g>
      <circle cx="32" cy="32" r="13" fill="url(#halo)"/>
      <g fill="url(#nucleo)"><path d="M24.3 41 C24.3 35.4 27.9 32.4 32 32.4 C36.1 32.4 39.7 35.4 39.7 41 Z"/><circle cx="32" cy="27.4" r="4.9"/></g>
    </svg>
  </g>

  <text class="titulo" x="600" y="172" text-anchor="middle" font-size="40" fill="#eef2ff" letter-spacing="1">
    <tspan font-weight="300">Infnet</tspan><tspan font-weight="700">Hub</tspan>
  </text>
  <text class="sub" x="600" y="210" text-anchor="middle" font-size="22" fill="#93c5fd" font-weight="500">
    TP5 · Implantação e Operação em Produção
  </text>
  <text class="stack" x="600" y="242" text-anchor="middle" font-size="15" fill="#94a3b8" letter-spacing="2">
    DOCKER · KUBERNETES · GRAFANA · GITHUB ACTIONS
  </text>
</svg>
