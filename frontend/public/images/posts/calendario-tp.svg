<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Prazo de entrega: calendário com a semana marcada e um cronômetro">
  <defs>
    <linearGradient id="cFundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a08"/><stop offset=".5" stop-color="#160f10"/><stop offset="1" stop-color="#0a0b16"/>
    </linearGradient>
    <linearGradient id="cAmbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="cLuz" cx="26%" cy="14%" r="62%">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".22"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#cFundo)"/>
  <rect width="1200" height="500" fill="url(#cLuz)"/>

  <!-- calendário -->
  <g transform="translate(150 86)">
    <rect x="0" y="18" width="420" height="360" rx="22" fill="#12131f" stroke="#3a3550" stroke-width="2"/>
    <rect x="0" y="18" width="420" height="66" rx="22" fill="url(#cAmbar)"/>
    <rect x="0" y="62" width="420" height="22" fill="url(#cAmbar)"/>
    <g fill="#7a5a12">
      <rect x="86" y="0" width="16" height="46" rx="8"/><rect x="318" y="0" width="16" height="46" rx="8"/>
    </g>
    <g fill="#5d5a78">
      <rect x="34" y="106" width="42" height="10" rx="5"/><rect x="102" y="106" width="42" height="10" rx="5"/>
      <rect x="170" y="106" width="42" height="10" rx="5"/><rect x="238" y="106" width="42" height="10" rx="5"/>
      <rect x="306" y="106" width="42" height="10" rx="5"/>
    </g>
    <g fill="#232338">
      <rect x="34" y="136" width="42" height="42" rx="10"/><rect x="102" y="136" width="42" height="42" rx="10"/>
      <rect x="170" y="136" width="42" height="42" rx="10"/><rect x="238" y="136" width="42" height="42" rx="10"/>
      <rect x="306" y="136" width="42" height="42" rx="10"/>
      <rect x="34" y="192" width="42" height="42" rx="10"/><rect x="102" y="192" width="42" height="42" rx="10"/>
      <rect x="238" y="192" width="42" height="42" rx="10"/><rect x="306" y="192" width="42" height="42" rx="10"/>
      <rect x="34" y="248" width="42" height="42" rx="10"/><rect x="102" y="248" width="42" height="42" rx="10"/>
      <rect x="170" y="248" width="42" height="42" rx="10"/><rect x="238" y="248" width="42" height="42" rx="10"/>
      <rect x="306" y="248" width="42" height="42" rx="10"/>
      <rect x="34" y="304" width="42" height="42" rx="10"/><rect x="102" y="304" width="42" height="42" rx="10"/>
      <rect x="170" y="304" width="42" height="42" rx="10"/>
    </g>
    <!-- o dia do prazo -->
    <rect x="166" y="188" width="50" height="50" rx="12" fill="url(#cAmbar)"/>
    <circle cx="191" cy="213" r="30" fill="none" stroke="#fbbf24" stroke-opacity=".5" stroke-width="2"/>
  </g>

  <!-- cronômetro -->
  <g transform="translate(830 250)">
    <circle r="118" fill="#12131f" stroke="#3a3550" stroke-width="2"/>
    <circle r="98" fill="none" stroke="#232338" stroke-width="14"/>
    <path d="M0 -98 A98 98 0 0 1 84.9 49" fill="none" stroke="url(#cAmbar)" stroke-width="14" stroke-linecap="round"/>
    <g stroke="#5d5a78" stroke-width="3" stroke-linecap="round">
      <path d="M0 -82v-12"/><path d="M82 0h12"/><path d="M0 82v12"/><path d="M-82 0h-12"/>
    </g>
    <path d="M0 0 L0 -62" stroke="#f4f7ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 0 L44 26" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <circle r="9" fill="#12131f" stroke="#f4f7ff" stroke-width="3"/>
    <rect x="-22" y="-140" width="44" height="20" rx="7" fill="#3a3550"/>
    <rect x="-9" y="-152" width="18" height="16" rx="5" fill="#5d5a78"/>
  </g>
</svg>
