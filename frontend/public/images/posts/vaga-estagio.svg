<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Vaga de estágio: crachá, prédio e trilha de carreira">
  <defs>
    <linearGradient id="vFundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062033"/><stop offset=".55" stop-color="#05182a"/><stop offset="1" stop-color="#030f1e"/>
    </linearGradient>
    <linearGradient id="vPredio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#164e63"/><stop offset="1" stop-color="#0b2b3a"/>
    </linearGradient>
    <linearGradient id="vCracha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="vLuz" cx="72%" cy="14%" r="60%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".26"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#vFundo)"/>
  <rect width="1200" height="500" fill="url(#vLuz)"/>

  <!-- horizonte de prédios -->
  <g transform="translate(0 500)">
    <rect x="60" y="-250" width="120" height="250" fill="url(#vPredio)"/>
    <rect x="196" y="-320" width="96" height="320" fill="url(#vPredio)"/>
    <rect x="308" y="-190" width="130" height="190" fill="url(#vPredio)"/>
    <rect x="900" y="-286" width="110" height="286" fill="url(#vPredio)"/>
    <rect x="1026" y="-210" width="120" height="210" fill="url(#vPredio)"/>
    <g fill="#7ee7f5" opacity=".55">
      <rect x="80" y="-228" width="16" height="18"/><rect x="112" y="-228" width="16" height="18"/><rect x="144" y="-228" width="16" height="18"/>
      <rect x="80" y="-190" width="16" height="18"/><rect x="144" y="-190" width="16" height="18"/>
      <rect x="214" y="-296" width="16" height="18"/><rect x="248" y="-296" width="16" height="18"/><rect x="214" y="-256" width="16" height="18"/>
      <rect x="330" y="-166" width="16" height="18"/><rect x="364" y="-166" width="16" height="18"/><rect x="398" y="-166" width="16" height="18"/>
      <rect x="920" y="-262" width="16" height="18"/><rect x="954" y="-262" width="16" height="18"/><rect x="920" y="-222" width="16" height="18"/>
      <rect x="1046" y="-186" width="16" height="18"/><rect x="1080" y="-186" width="16" height="18"/>
    </g>
  </g>

  <!-- trilha de carreira -->
  <g fill="none" stroke="#3b8ef5" stroke-width="3" stroke-dasharray="12 10" opacity=".65">
    <path d="M120 420 C 340 380, 420 300, 600 300 S 900 260, 1100 200"/>
  </g>
  <g fill="#3b8ef5">
    <circle cx="120" cy="420" r="8"/><circle cx="600" cy="300" r="8"/>
  </g>
  <circle cx="1100" cy="200" r="12" fill="#22d3ee"/>
  <circle cx="1100" cy="200" r="22" fill="none" stroke="#22d3ee" stroke-opacity=".45" stroke-width="2"/>

  <!-- crachá -->
  <g transform="translate(560 96) rotate(-6)">
    <path d="M60 -46 L60 0" stroke="#1e4a63" stroke-width="6"/>
    <rect x="-10" y="0" width="140" height="184" rx="14" fill="#09263a" stroke="#22d3ee" stroke-opacity=".5" stroke-width="2"/>
    <rect x="42" y="-8" width="36" height="16" rx="5" fill="#0e7490"/>
    <circle cx="60" cy="56" r="28" fill="url(#vCracha)"/>
    <path d="M32 104a28 28 0 0 1 56 0z" fill="url(#vCracha)" opacity=".8"/>
    <g fill="#7ba7c9">
      <rect x="20" y="124" width="80" height="8" rx="4"/>
      <rect x="34" y="142" width="52" height="6" rx="3"/>
      <rect x="26" y="160" width="68" height="6" rx="3"/>
    </g>
  </g>
</svg>
