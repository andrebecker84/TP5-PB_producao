<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Agentes de IA: núcleo neural conectado a agentes em órbita">
  <defs>
    <linearGradient id="iFundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140a2e"/><stop offset=".5" stop-color="#0a0a24"/><stop offset="1" stop-color="#050818"/>
    </linearGradient>
    <linearGradient id="iNucleo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/><stop offset=".55" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="iHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".55"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#iFundo)"/>

  <!-- poeira de dados -->
  <g fill="#c4b5fd" opacity=".35">
    <circle cx="120" cy="90" r="2"/><circle cx="240" cy="160" r="1.6"/><circle cx="360" cy="70" r="2.2"/>
    <circle cx="940" cy="120" r="2"/><circle cx="1080" cy="220" r="1.8"/><circle cx="820" cy="60" r="1.5"/>
    <circle cx="180" cy="380" r="1.8"/><circle cx="1020" cy="400" r="2"/><circle cx="520" cy="440" r="1.6"/>
  </g>

  <g transform="translate(600 250)">
    <circle r="190" fill="url(#iHalo)"/>

    <!-- órbitas -->
    <g fill="none" stroke="#7c3aed" stroke-opacity=".35" stroke-width="1.5">
      <ellipse rx="230" ry="96"/>
      <ellipse rx="230" ry="96" transform="rotate(60)"/>
      <ellipse rx="230" ry="96" transform="rotate(-60)"/>
    </g>

    <!-- ligações do núcleo aos agentes -->
    <g stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.5">
      <path d="M0 0 L230 0"/><path d="M0 0 L115 83"/><path d="M0 0 L-115 -83"/>
      <path d="M0 0 L-115 83"/><path d="M0 0 L115 -83"/><path d="M0 0 L-230 0"/>
    </g>

    <!-- núcleo -->
    <circle r="62" fill="#0b0a22" stroke="url(#iNucleo)" stroke-width="4"/>
    <g stroke="#c084fc" stroke-width="2.5" fill="none" opacity=".9">
      <path d="M-26 -14h16v28h16"/><path d="M-26 14h10v-28h22"/><path d="M20 -14h8"/><path d="M20 14h8"/>
    </g>
    <g fill="#22d3ee"><circle cx="-26" cy="-14" r="4"/><circle cx="-26" cy="14" r="4"/><circle cx="28" cy="-14" r="4"/><circle cx="28" cy="14" r="4"/></g>

    <!-- agentes -->
    <g>
      <g transform="translate(230 0)"><circle r="26" fill="#160f38" stroke="#22d3ee" stroke-width="2.5"/><rect x="-10" y="-8" width="20" height="16" rx="5" fill="#22d3ee" opacity=".85"/></g>
      <g transform="translate(115 83)"><circle r="22" fill="#160f38" stroke="#a855f7" stroke-width="2.5"/><rect x="-8" y="-7" width="16" height="14" rx="4" fill="#a855f7" opacity=".85"/></g>
      <g transform="translate(-115 -83)"><circle r="22" fill="#160f38" stroke="#a855f7" stroke-width="2.5"/><rect x="-8" y="-7" width="16" height="14" rx="4" fill="#a855f7" opacity=".85"/></g>
      <g transform="translate(-115 83)"><circle r="20" fill="#160f38" stroke="#3b8ef5" stroke-width="2.5"/><rect x="-7" y="-6" width="14" height="12" rx="4" fill="#3b8ef5" opacity=".85"/></g>
      <g transform="translate(115 -83)"><circle r="20" fill="#160f38" stroke="#3b8ef5" stroke-width="2.5"/><rect x="-7" y="-6" width="14" height="12" rx="4" fill="#3b8ef5" opacity=".85"/></g>
      <g transform="translate(-230 0)"><circle r="24" fill="#160f38" stroke="#22d3ee" stroke-width="2.5"/><rect x="-9" y="-7" width="18" height="14" rx="4" fill="#22d3ee" opacity=".85"/></g>
    </g>
  </g>
</svg>
