# Quem pode se conectar ao PostgreSQL, e como — igual para os três bancos.
#
# Pela rede, só com TLS: `hostssl` aceita a conexão cifrada com senha, e
# `hostnossl` recusa qualquer tentativa sem cifragem, em vez de deixá-la cair
# numa regra mais permissiva. Os serviços conectam com sslmode=verify-full, que
# também confere o certificado do servidor e o nome dele.
#
# Pelo socket local, dentro do próprio contêiner, sem senha: é por onde passam
# o healthcheck (pg_isready) e o `docker compose exec psql` do roteiro de
# demonstração, e nenhum dos dois atravessa a rede.

# TIPO       BANCO  USUÁRIO  ENDEREÇO  MÉTODO
local        all    all                trust
hostssl      all    all      all       scram-sha-256
hostnossl    all    all      all       reject
