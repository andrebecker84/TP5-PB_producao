# Tema de login do Infnet Hub.
#
# Herda o keycloak.v2 inteiro (paginas, formularios, fluxos de senha) e troca
# so a aparencia (css/infnethub.css, js/infnethub.js) e alguns textos
# (messages_pt_BR), para a
# tela do provedor de identidade continuar a tela de entrada da plataforma em
# vez de parecer outro site.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/infnethub.css
# o que monta a tela de entrada em volta do formulario: fundo, aviso,
# digital, abertura, nota e atalho do painel de operacao
scripts=js/infnethub.js
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css

# sempre escuro, como a plataforma, independente do tema do sistema
darkMode=false
kcHtmlClass=login-pf pf-v5-theme-dark

locales=pt-BR
