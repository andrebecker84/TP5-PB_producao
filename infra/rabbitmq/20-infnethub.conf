# =========================================================================
# RabbitMQ do Infnet Hub — topologia declarada no próprio broker
#
# O problema que isto resolve: uma fila do RabbitMQ não guarda histórico. Uma
# mensagem publicada numa exchange sem fila ligada é descartada, e um
# consumidor que declara a sua fila depois não recebe o que já passou.
#
# Se cada serviço declarar apenas a própria fila na subida, a ordem de
# inicialização passa a decidir quem recebe o quê: o core sobe, publica os
# cadastros da carga inicial, e o serviço que ainda não declarou a fila perde
# esses eventos para sempre. Foi o que aconteceu na primeira subida do
# notificacao-service.
#
# Com as definições carregadas aqui, o broker já nasce com todas as exchanges,
# filas e ligações. Qualquer evento publicado encontra as filas de todos os
# consumidores — inclusive dos que ainda não subiram, onde fica esperando.
#
# Os serviços continuam declarando a própria topologia (a declaração é
# idempotente), o que mantém os testes com Testcontainers independentes deste
# arquivo. Os argumentos das filas precisam ser IDÊNTICOS aos declarados no
# código: o RabbitMQ recusa redeclarar uma fila existente com argumentos
# diferentes (PRECONDITION_FAILED).
#
# ATENÇÃO — com definições carregadas na subida, o RabbitMQ não cria o usuário
# padrão das variáveis RABBITMQ_DEFAULT_USER/PASS. Por isso o usuário está no
# definitions.json, com a senha em hash (rabbitmqctl hash_password). Senha de
# desenvolvimento: infnethub.
# =========================================================================

load_definitions = /etc/rabbitmq/definitions.json

# =========================================================================
# Três nós, e não um
#
# As filas são quorum: cada mensagem é gravada numa maioria de réplicas antes
# de o broker confirmar a publicação. Com um nó só, "maioria" é aquele nó, e a
# réplica não existe. Com três, um nó pode cair — por falha ou para ser
# atualizado — e as filas continuam aceitando e entregando mensagens, sem perder
# nenhuma confirmada.
#
# A descoberta é a lista fixa dos três nomes: no Compose eles são conhecidos de
# antemão, e não há o que descobrir.
# =========================================================================

cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3

# As filas nascem quando o primeiro nó sobe — antes de os outros dois estarem
# no cluster —, e uma fila quorum criada com um membro só continuaria com um
# membro só. A reconciliação contínua acrescenta réplicas até três, sozinha,
# assim que os nós entram; e as repõe se um nó for substituído.
quorum_queue.continuous_membership_reconciliation.enabled = true
quorum_queue.continuous_membership_reconciliation.target_group_size = 3
quorum_queue.continuous_membership_reconciliation.interval = 10000

# =========================================================================
# Só TLS
#
# A porta AMQP sem cifragem é desligada: os serviços falam com o broker pela
# 5671, e o certificado do broker é verificado contra a autoridade de
# desenvolvimento, com conferência de nome. O tráfego entre os nós também é
# cifrado — ver inter_node_tls.config e as variáveis de ambiente no Compose.
#
# O painel de gestão continua em HTTP na 15672, publicado só no 127.0.0.1 da
# máquina: é o navegador de quem opera, e não tráfego entre serviços.
# =========================================================================

listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /certs/ca.crt
ssl_options.certfile = /certs/rabbitmq/servidor.crt
ssl_options.keyfile = /certs/rabbitmq/servidor.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

# As métricas para o Prometheus, também por TLS.
prometheus.ssl.port = 15691
prometheus.ssl.cacertfile = /certs/ca.crt
prometheus.ssl.certfile = /certs/rabbitmq/servidor.crt
prometheus.ssl.keyfile = /certs/rabbitmq/servidor.key
# O exportador em HTTP simples não tem como ser desligado nesta versão do
# plugin; preso ao 127.0.0.1 do contêiner, ele deixa de existir para a rede.
prometheus.tcp.ip = 127.0.0.1

# Só TLS 1.3 e 1.2 — as versões anteriores têm fraquezas conhecidas.
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
