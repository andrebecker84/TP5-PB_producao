spring.application.name=boletim-service

server.port=${SERVER_PORT:21082}

# ── Registro de serviços ───────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:21761/eureka}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,prometheus
# Toda série leva o nome do serviço — é por ele que o painel separa as linhas.
# E o tempo de resposta vai como histograma, para o painel calcular percentis
# no Prometheus somando todas as instâncias, o que percentis prontos não permitem.
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ── Saúde: o broker fora do ar NÃO é este serviço fora do ar ───────────────
# Com o RabbitMQ desligado, o indicador padrão faz /actuator/health responder
# DOWN e 503 — e quem orquestra reinicia o contêiner ou o tira do balanceador.
# Seria o contrário do certo: este serviço atende suas leituras com o banco
# dele, sem depender do broker no caminho da requisição.
#
# O estado do broker continua visível em /actuator/health para quem diagnostica;
# as sondas de orquestração usam /actuator/health/readiness.
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# ── Rastreamento distribuído (TP5) ─────────────────────────────────────────
# Todo pedido que entra ganha um traceId, e ele segue adiante: nos cabeçalhos
# HTTP (W3C traceparent) e nos cabeçalhos das mensagens do RabbitMQ. É o que
# permite abrir no Grafana uma requisição e ver o caminho inteiro — gateway,
# serviço, banco, broker e o consumidor do outro lado —, e ir do trace aos logs
# daquela requisição, e dos logs ao trace.
#
# Amostragem de 100% por padrão: num ambiente de demonstração, toda requisição
# interessa. Com tráfego real, a variável baixa a fração sem novo build.
management.tracing.sampling.probability=${TRACING_AMOSTRAGEM:1.0}
# O envio ao coletor só liga onde há coletor — Compose e Kubernetes definem
# OTLP_HABILITADO. Rodando pela IDE ou nos testes, os spans continuam existindo
# (e o traceId continua no log), só não são enviados a lugar nenhum.
management.tracing.export.otlp.enabled=${OTLP_HABILITADO:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_URL:http://localhost:4318/v1/traces}
management.opentelemetry.resource-attributes[deployment.environment]=${AMBIENTE:local}
# As métricas continuam no Prometheus, por coleta. O starter do OpenTelemetry
# traz também o envio de métricas por OTLP, que aqui seria duplicado.
management.otlp.metrics.export.enabled=false
# O RabbitMQ entra no rastreamento: quem publica grava o traceparent nos
# cabeçalhos da mensagem, e o ouvinte do outro lado continua o mesmo trace.
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

# ── CORS ───────────────────────────────────────────────────────────────────
# Só vale no acesso direto ao serviço; pelo gateway quem responde é ele.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:21000}

# ── Erros em JSON ──────────────────────────────────────────────────────────
# Mesmo contrato de erro da aplicação central: um cliente que consome os dois
# serviços através do gateway não deveria precisar distinguir de qual deles veio
# a falha para saber ler a resposta.
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ── Perfil ─────────────────────────────────────────────────────────────────
#   dev  - PostgreSQL próprio do boletim (docker compose up -d postgres-boletim)
#   prod - PostgreSQL a partir de variáveis de ambiente
#   test - H2 em memória (ativado pelos testes)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Sem Envers aqui, ao contrário do core. O histórico por revisão existe lá
# porque post e vaga são editados pelos próprios usuários e a autoria da
# alteração importa. Conceito de competência é lançado pela secretaria e
# corrigido por exceção — auditar cada linha custaria mais do que rende. Ficou
# de fora por decisão, não por esquecimento.

# ── RabbitMQ ───────────────────────────────────────────────────────────────
# O boletim não chama mais o infnethub-core. Recebe os eventos de usuário pela
# fila boletim.usuarios e mantém a réplica local dos alunos.
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:21672}
spring.rabbitmq.username=${RABBIT_USER:infnethub}
spring.rabbitmq.password=${RABBIT_PASS:infnethub}
# Ver desistirDepressa, na configuração de mensageria.
spring.rabbitmq.connection-timeout=3s

# ── Publicação: o boletim também responde ──────────────────────────────────
# Desde a saga de expurgo este serviço não é só consumidor. Uma resposta
# perdida deixa o processo de remoção parado para sempre, sem que ninguém saiba
# — daí as mesmas garantias que o core usa para publicar.
spring.rabbitmq.publisher-confirm-type=correlated
# mandatory + returns: mensagem sem fila de destino volta para o produtor em
# vez de ser descartada em silêncio. O relay trata a devolução como falha.
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

app.outbox.intervalo-ms=500
app.outbox.espera-confirmacao-ms=5000
# Lote por transação, e o tempo máximo de uma rodada escoando lotes seguidos.
# Com lote cheio e nada falhando, a rodada busca o próximo em vez de esperar o
# intervalo — um pico é escoado de uma vez.
app.outbox.lote=500
app.outbox.orcamento-ms=2000

# Um consumidor por fila, de propósito: é o que mantém a ordem em que o core
# publicou. Com dois, um UsuarioAtualizado poderia ser processado antes do
# UsuarioCadastrado que o precede. A versão no evento protege a réplica mesmo
# assim, mas não há por que criar o problema — o volume de cadastros não pede
# paralelismo.
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=10

# Três tentativas dentro do consumidor, com espera crescente (1s, depois 4s).
# A falha passageira — o banco do boletim reiniciando, um bloqueio momentâneo —
# se resolve aqui. A que persiste é rejeitada sem reenfileirar, e o RabbitMQ a
# desvia para a fila de mensagens mortas (boletim.usuarios.dlq), onde fica
# guardada para inspeção em vez de travar a fila atrás dela.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=4
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ── Identidade (OpenID Connect no Keycloak) ────────────────────────────────
# Duas URLs para o mesmo Keycloak: a pública é a que o navegador usa e a que
# aparece no campo "iss" dos tokens; a interna é a que este contêiner alcança.
# A validação do token confere a assinatura pela URL interna e o emissor pela
# pública — se as duas não batessem, um token emitido por outro realm passaria.
app.keycloak.url-publica=${KEYCLOAK_URL_PUBLICA:http://localhost:21180}
app.keycloak.url-interna=${KEYCLOAK_URL_INTERNA:http://localhost:21180}
app.keycloak.realm=${KEYCLOAK_REALM:infnethub}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${app.keycloak.url-interna}/realms/${app.keycloak.realm}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=${app.keycloak.url-publica}/realms/${app.keycloak.realm}
