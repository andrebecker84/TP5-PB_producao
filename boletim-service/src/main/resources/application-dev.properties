# ── Perfil dev — PostgreSQL PRÓPRIO do boletim ─────────────────────────────
# Porta 21433, e não 21432: aquela é a do banco do infnethub-core. São duas
# instâncias distintas, e é isso que Database per Service significa aqui — não
# dois schemas no mesmo servidor, mas dois servidores. O boletim não tem
# credencial, rota nem driver que alcance as tabelas de usuários, posts e vagas.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:21433}/boletim}
spring.datasource.username=${DB_USER:boletim}
spring.datasource.password=${DB_PASS:boletim}
spring.datasource.driver-class-name=org.postgresql.Driver

# O schema é responsabilidade do Flyway. O Hibernate apenas confere se o
# mapeamento das entidades bate com as tabelas existentes e falha no start caso
# tenham divergido.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
