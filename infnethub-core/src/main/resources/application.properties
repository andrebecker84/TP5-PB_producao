# Identidade da aplicação. No TP3 este nome deixa de ser apenas rótulo de log:
# é por ele que o serviço se registra no service discovery e é por ele que o
# gateway o encontra. No TP4 ele também assina os eventos que o core publica.
spring.application.name=infnethub-core

# ── Portas ─────────────────────────────────────────────────────────────────
# O TP5 usa um bloco de portas próprio (21000/21080/21081/21082/21761/21432/
# 21433, e 21672/21673 do RabbitMQ) em vez das usuais 8080/3000/5432/5672. Cada etapa do projeto integrado
# (TP1…TP5) pode precisar rodar ao mesmo tempo, e as portas padrão são as
# primeiras a serem disputadas por outros projetos na mesma máquina. Com a
# arquitetura distribuída sobem vários processos de uma vez, daí o bloco maior.
# Todas são sobrescrevíveis por variável.
server.port=${SERVER_PORT:21081}

# ── CORS ───────────────────────────────────────────────────────────────────
# Origens liberadas para o front-end. Configurável em vez de fixa no código:
# em produção a origem não é localhost.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:21000}

# ── Registro de serviços ───────────────────────────────────────────────────
# A aplicação se anuncia no Eureka pelo spring.application.name. O gateway
# pergunta o endereço ao registro em vez de carregá-lo em configuração. Desde o
# TP4 o boletim-service não a procura mais: recebe os dados do aluno por evento.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:21761/eureka}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,prometheus
# Toda série leva o nome do serviço — é por ele que o painel separa as linhas.
# E o tempo de resposta vai como histograma, para o painel calcular percentis
# no Prometheus somando todas as instâncias, o que percentis prontos não permitem.
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ── Saúde: o broker fora do ar NÃO é este serviço fora do ar ───────────────
# Com o RabbitMQ desligado, o indicador padrão faz /actuator/health responder
# DOWN e 503 — e quem orquestra reinicia o contêiner ou o tira do balanceador.
# Para este serviço isso seria exatamente o contrário do certo: a caixa de
# saída existe para que ele continue aceitando cadastros sem o broker. Tirá-lo
# do ar por causa de uma dependência que ele deliberadamente não usa no caminho
# da requisição transformaria uma indisponibilidade parcial em total.
#
# A saída é a que o próprio Spring Boot oferece: grupos. O estado do broker
# continua visível em /actuator/health para quem está diagnosticando, e as
# sondas de orquestração passam a usar /actuator/health/readiness, que reflete
# a capacidade de atender requisições.
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# ── Rastreamento distribuído (TP5) ─────────────────────────────────────────
# Todo pedido que entra ganha um traceId, e ele segue adiante: nos cabeçalhos
# HTTP (W3C traceparent) e nos cabeçalhos das mensagens do RabbitMQ. É o que
# permite abrir no Grafana uma requisição e ver o caminho inteiro — gateway,
# serviço, banco, broker e o consumidor do outro lado —, e ir do trace aos logs
# daquela requisição, e dos logs ao trace.
#
# Amostragem de 100% por padrão: num ambiente de demonstração, toda requisição
# interessa. Com tráfego real, a variável baixa a fração sem novo build.
management.tracing.sampling.probability=${TRACING_AMOSTRAGEM:1.0}
# O envio ao coletor só liga onde há coletor — Compose e Kubernetes definem
# OTLP_HABILITADO. Rodando pela IDE ou nos testes, os spans continuam existindo
# (e o traceId continua no log), só não são enviados a lugar nenhum.
management.tracing.export.otlp.enabled=${OTLP_HABILITADO:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_URL:http://localhost:4318/v1/traces}
management.opentelemetry.resource-attributes[deployment.environment]=${AMBIENTE:local}
# As métricas continuam no Prometheus, por coleta. O starter do OpenTelemetry
# traz também o envio de métricas por OTLP, que aqui seria duplicado.
management.otlp.metrics.export.enabled=false
# O RabbitMQ entra no rastreamento: quem publica grava o traceparent nos
# cabeçalhos da mensagem, e o ouvinte do outro lado continua o mesmo trace.
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

# ── RabbitMQ ───────────────────────────────────────────────────────────────
# Porta 21672 no host, e não a 5672 padrão: o TP5 tem bloco próprio (21xxx), e
# a 5672 pode estar tomada por outro RabbitMQ na mesma máquina.
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:21672}
spring.rabbitmq.username=${RABBIT_USER:infnethub}
spring.rabbitmq.password=${RABBIT_PASS:infnethub}
# Ver desistirDepressa, na configuração de mensageria.
spring.rabbitmq.connection-timeout=3s

# Confirmação do broker por mensagem (publisher confirms). É o que permite ao
# relay do outbox só marcar um evento como publicado depois de o RabbitMQ
# assumir a responsabilidade por ele.
spring.rabbitmq.publisher-confirm-type=correlated
# mandatory + returns: mensagem sem fila de destino volta para o produtor em
# vez de ser descartada em silêncio. O relay trata a devolução como falha.
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# ── Outbox ─────────────────────────────────────────────────────────────────
# Intervalo entre as rodadas do relay. Meio segundo é o atraso máximo entre o
# commit e a publicação quando tudo está no ar — imperceptível para quem abre o
# boletim, e barato para o banco, que só lê um índice parcial das pendentes.
app.outbox.intervalo-ms=500
app.outbox.espera-confirmacao-ms=5000
# Lote por transação, e o tempo máximo de uma rodada escoando lotes seguidos.
# Com lote cheio e nada falhando, a rodada busca o próximo em vez de esperar o
# intervalo — um pico é escoado de uma vez.
app.outbox.lote=500
app.outbox.orcamento-ms=2000

# Perfil ativo. Sobrescreva com SPRING_PROFILES_ACTIVE ou --spring.profiles.active=<perfil>
#   dev  - PostgreSQL local via Docker Compose (padrão)
#   prod - PostgreSQL a partir de variáveis de ambiente
#   test - H2 em memória (ativado pelos testes)
#
# Os dois perfis executáveis persistem em PostgreSQL: o H2 existe apenas nos
# testes, em escopo "test". Não há caminho de execução em banco efêmero.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── JPA / Hibernate ────────────────────────────────────────────────────────
# open-in-view desligado: a sessão JPA não sobrevive à camada web, o que torna
# o carregamento LAZY explícito e evita consultas disparadas na serialização.
spring.jpa.open-in-view=false

# Lotes de INSERT/UPDATE reduzem o número de round-trips ao banco.
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Hibernate Envers (histórico por snapshot) ──────────────────────────────
# Cada revisão grava a linha inteira da entidade em <tabela>_aud: o snapshot é
# o estado completo naquele ponto no tempo, não um delta.
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype

# ValidityAuditStrategy grava em cada revisão o momento em que ela deixou de
# valer (revend). Consultar "como estava em T" vira um range scan em vez de um
# subselect de máximo por linha — mais barato conforme o histórico cresce.
spring.jpa.properties.org.hibernate.envers.audit_strategy=org.hibernate.envers.strategy.internal.ValidityAuditStrategy
spring.jpa.properties.org.hibernate.envers.audit_strategy_validity_store_revend_timestamp=true

# Sem isto o Envers grava a revisão de DELETE apenas com a chave primária e os
# demais campos nulos, perdendo o último estado conhecido do registro — que é
# justamente o dado mais relevante numa auditoria.
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# ── Erros em JSON ──────────────────────────────────────────────────────────
# Esta é uma API JSON, e a página de erro padrão do Spring (Whitelabel) devolve
# HTML. Um cliente que faz JSON.parse na resposta quebra com um erro de sintaxe
# que nada diz sobre a causa real — o problema fica mais difícil de diagnosticar
# do que a falha original.
server.error.whitelabel.enabled=false

# Faz a URL sem mapeamento chegar ao GlobalExceptionHandler como exceção, em vez
# de ser resolvida pelo tratamento interno de erro. Sem as duas propriedades
# abaixo o handler de rota inexistente nunca é chamado: o manipulador de
# recursos estáticos intercepta a requisição antes.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# O back-end não serve páginas nem arquivos — só JSON. Mensagem e rastreamento
# de pilha ficam fora da resposta: o cliente recebe o necessário para corrigir a
# requisição, e o diagnóstico completo vai para o log do servidor.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ── Identidade (OpenID Connect no Keycloak) ────────────────────────────────
# Duas URLs para o mesmo Keycloak: a pública é a que o navegador usa e a que
# aparece no campo "iss" dos tokens; a interna é a que este contêiner alcança.
# A validação do token confere a assinatura pela URL interna e o emissor pela
# pública — se as duas não batessem, um token emitido por outro realm passaria.
app.keycloak.url-publica=${KEYCLOAK_URL_PUBLICA:http://localhost:21180}
app.keycloak.url-interna=${KEYCLOAK_URL_INTERNA:http://localhost:21180}
app.keycloak.realm=${KEYCLOAK_REALM:infnethub}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${app.keycloak.url-interna}/realms/${app.keycloak.realm}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=${app.keycloak.url-publica}/realms/${app.keycloak.realm}

# Prazo da saga de expurgo: sem resposta dos participantes nesse tempo, o
# bloqueio é desfeito pela mesma compensação da recusa. Um dia em produção; o
# docker-compose.yml o encurta para a demonstração caber numa apresentação.
app.expurgo.prazo=PT24H
app.expurgo.verificacao-ms=30000
