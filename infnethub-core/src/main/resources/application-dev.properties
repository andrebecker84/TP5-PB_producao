# ── Perfil dev — PostgreSQL local (docker compose up -d postgres) ──────────
# DB_PORT acompanha o mapeamento do docker-compose. O padrão é 21432, e não
# 5432, para não disputar a porta com outro PostgreSQL na mesma máquina — nesta
# aqui a 5432 já está tomada. O banco do boletim-service fica na 21433, em
# instância separada (Database per Service).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:21432}/infnethub}
spring.datasource.username=${DB_USER:infnethub}
spring.datasource.password=${DB_PASS:infnethub}
spring.datasource.driver-class-name=org.postgresql.Driver

# O schema é responsabilidade do Flyway. O Hibernate apenas confere se o
# mapeamento das entidades bate com as tabelas existentes e falha no start
# caso tenham divergido.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# O Flyway cuida apenas do schema. A carga de demonstração fica com o DataLoader,
# que grava via JPA e por isso nasce com histórico de auditoria — um seed em SQL
# bruto entraria por baixo do Hibernate e não geraria revisão nenhuma.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Pool de conexões
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# SQL visível em desenvolvimento
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

logging.level.org.hibernate.envers=INFO
