# =========================================================================
# Perfil k8s — o serviço dentro do cluster Kubernetes (TP5).
#
# Ativo junto com o prod (SPRING_PROFILES_ACTIVE=prod,k8s[,demo]): a
# configuração de produção vale inteira, e este arquivo acrescenta só o que
# muda por estar num orquestrador. Os endereços — banco, broker, Keycloak,
# coletor — não estão aqui: vêm do ConfigMap e do Secret do cluster
# (k8s/base), porque mudam de um cluster para outro e o JAR não.
# =========================================================================

# ── Descoberta: o cluster é o registro ─────────────────────────────────────
# No Compose, cada instância se anuncia no Eureka. No Kubernetes, o próprio
# cluster já sabe quais pods existem e quais estão prontos: o Service tem um
# nome DNS estável e só encaminha para pods que passaram na readiness. Manter
# o Eureka aqui seria ter dois registros discordando um do outro durante uma
# atualização gradual.
eureka.client.enabled=false

# ── Saída graciosa ─────────────────────────────────────────────────────────
# Ao receber SIGTERM — numa atualização, numa redução de escala, num nó sendo
# esvaziado —, o servidor para de aceitar conexões e termina as requisições em
# curso antes de sair. O prazo cabe no terminationGracePeriodSeconds do
# Deployment (30 s), com folga para o preStop.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ── Sondas ─────────────────────────────────────────────────────────────────
# liveness: o processo está vivo? Falhar aqui reinicia o contêiner — por isso
#           só o estado interno da aplicação, nunca uma dependência externa.
# readiness: pode receber tráfego? Aqui entra o banco próprio: sem ele o
#           serviço não responde nada de útil, e o Service deixa de mandar
#           requisições ao pod até o banco voltar. O broker continua fora, pelo
#           motivo explicado no application.properties.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# ── Logs ───────────────────────────────────────────────────────────────────
# JSON na saída padrão (formato ECS): o Alloy recolhe os logs de todos os pods
# e os envia ao Loki, já com o traceId separado para ligar log e trace.
logging.structured.format.console=ecs
