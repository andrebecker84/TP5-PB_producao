# ── Perfil prod — PostgreSQL a partir de variáveis de ambiente ─────────────
# Nenhuma credencial fica no repositório: as três variáveis são obrigatórias e
# a aplicação falha no start se estiverem ausentes.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Apenas o schema — a carga de demonstração de db/seed não entra em produção.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# SQL fora do log e erros sem stack trace na resposta HTTP.
spring.jpa.show-sql=false
server.error.include-stacktrace=never
server.error.include-message=never

logging.level.org.hibernate.SQL=WARN
