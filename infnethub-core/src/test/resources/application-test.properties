# ── Perfil test — H2 em memória ────────────────────────────────────────────
# Banco descartável por execução: cada classe de teste parte de um schema limpo,
# sem depender de Docker nem de estado deixado por testes anteriores.
spring.datasource.url=jdbc:h2:mem:infnethubdb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# O Hibernate gera o schema, incluindo as tabelas _aud do Envers. As migrations
# do PostgreSQL têm cobertura própria em FlywayMigrationIT.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.test=WARN

# ── Registro de serviços desligado nos testes ──────────────────────────────
# Sem isto, cada contexto de teste tenta se registrar num Eureka que não existe:
# o start fica mais lento pelas tentativas de conexão e o log enche de erros que
# nada têm a ver com o que está sendo testado. Um teste unitário não deve
# depender de infraestrutura de rede estar de pé.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

# ── Relay do outbox desligado nos testes ───────────────────────────────────
# Os testes de serviço verificam o que entra na caixa de saída; a entrega ao
# broker tem teste próprio, contra um RabbitMQ real em contêiner, que religa o
# relay. Ligado aqui, ele tentaria alcançar um broker inexistente a cada meio
# segundo e encheria o log de falhas de conexão.
app.outbox.relay.habilitado=false

# ── Nenhum broker ao alcance ───────────────────────────────────────────────
# Porta sem serviço, de propósito. Se o ambiente de desenvolvimento estiver no
# ar nesta máquina, a porta padrão (21672) apontaria para um RabbitMQ de
# verdade, e um teste de serviço publicaria nele sem ninguém perceber. Os
# testes de mensageria sobem o próprio broker em contêiner, que substitui esta
# configuração.
spring.rabbitmq.port=1
