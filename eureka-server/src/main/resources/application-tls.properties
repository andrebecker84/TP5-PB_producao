spring.ssl.bundle.pem.servidor.keystore.certificate=${TLS_CERTIFICADO:/certs/servidor.crt}
spring.ssl.bundle.pem.servidor.keystore.private-key=${TLS_CHAVE:/certs/servidor.key}
server.ssl.bundle=servidor
