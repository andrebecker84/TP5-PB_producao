spring.application.name=eureka-server

# Porta do bloco do TP3 (ver docker-compose.yml). 8761 é a convenção do Eureka;
# aqui ela vira 21761 pelo mesmo motivo das demais: não disputar porta com os
# outros TPs nem com outros projetos na mesma máquina.
server.port=${SERVER_PORT:21761}

# ── O registro não se registra em si mesmo ─────────────────────────────────
# Estas duas propriedades existem porque o starter do servidor traz junto o
# cliente: sem desligá-las, o Eureka tenta se cadastrar e buscar o registro em
# si próprio no start, e polui o log com erros de conexão até o servidor
# terminar de subir. Fazem sentido apenas por ser um nó único — numa topologia
# com réplicas, é justamente por esse mecanismo que os pares se conhecem.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}

# ── Ritmo de expiração ─────────────────────────────────────────────────────
# Em desenvolvimento o modo de autopreservação atrapalha: ao derrubar um
# serviço, o Eureka conclui que perdeu a rede (e não o serviço) e mantém no
# registro uma instância que não existe mais, deixando o gateway rotear para o
# vazio. Em produção o padrão é o contrário — a autopreservação é o que evita
# esvaziar o registro inteiro durante uma partição de rede.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000

# Sem o cache de leitura intermediário. Por padrão o registro responde de uma
# cópia atualizada a cada 30 s: uma instância que acabou de sair — ou de
# entrar — continua invisível para quem consulta por meio minuto. Medido: com
# ele, o gateway mandou requisições ao endereço de um contêiner já recriado
# durante vinte segundos. Com poucos clientes consultando, o cache não economiza
# nada que valha esse atraso.
eureka.server.use-read-only-response-cache=false

# Health e info abertos: é por /actuator/health que o Compose decide se o
# registro está pronto para receber os demais serviços.
management.endpoints.web.exposure.include=health,info
